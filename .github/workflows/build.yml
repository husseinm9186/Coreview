name: build

# Tauri does not support cross-compiling bundles between platforms, so each
# one is built on its own runner. Linux produces .deb and AppImage; Windows
# produces the NSIS .exe and the MSI; macOS produces a universal .dmg that
# runs on both Apple Silicon and Intel.
#
# LT-311: every installer, on every push — NSIS, MSI, .deb, AppImage, the
# universal .dmg, and the offline Windows installer that carries the WebView2
# runtime. LT-305's Windows-only narrowing is over; he asked for all of them.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # One workspace now, so one cache and one target/ at the repo root.
      - uses: Swatinem/rust-cache@v2

      # The probe crate is Tauri-free, so it needs none of the GTK stack.
      # src-tauri does; on Windows nothing extra is required.
      - name: Linux build dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libsoup-3.0-dev libssl-dev libdbus-1-dev \
            libxdo-dev libayatana-appindicator3-dev librsvg2-dev \
            build-essential curl wget file pkg-config \
            iputils-ping traceroute

      - run: npm ci

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Frontend tests
        run: npm test

      # generate_context! validates that frontendDist exists, so the web build
      # has to happen before any cargo command that expands it.
      - name: Build frontend
        run: npm run build

      - name: Probe crate tests
        run: cargo test -p coreview-probe

      # Live tests run real ping processes against 127.0.0.1 and the RFC 5737
      # documentation range. Loopback is available on both runners; the
      # documentation range is expected to time out, which is the point.
      - name: Probe crate live tests
        run: cargo test -p coreview-probe --test live_linux -- --test-threads=1

      - name: Backend tests
        run: cargo test -p coreview

      # Findings are echoed as annotations as well as logged. A failure here is
      # otherwise only visible by downloading the job log, which needs admin
      # rights on the repository — so a red tick said "Clippy failed" and
      # nothing more. The one that prompted this was an import used only by
      # Linux-only tests, invisible on the Linux runner.
      - name: Clippy
        shell: bash
        run: |
          set -o pipefail
          if ! cargo clippy --workspace --all-targets --message-format=short -- -D warnings 2>&1 | tee clippy.txt; then
            grep -E "(warning|error)(\[|:)" clippy.txt | head -40 | while IFS= read -r line; do
              echo "::error::${line}"
            done
            exit 1
          fi

      # LT-265: known vulnerabilities. What ships — every Rust crate, and the
      # npm packages bundled into the app — fails the build. Development-only
      # npm packages (the test runner and dev server) are reported as a warning:
      # they never reach an installer, and their fixes are major upgrades that
      # get their own roadmap item. Ignored Rust advisories, each with its
      # reason, are in .cargo/audit.toml.
      - name: npm audit
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          npm audit --omit=dev
          npm audit || echo "::warning title=npm audit::development-only packages have advisories; see this step's log"

      - name: Install cargo-audit
        if: matrix.os == 'ubuntu-latest'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: cargo audit
        if: matrix.os == 'ubuntu-latest'
        run: cargo audit

  # Every installer: NSIS and MSI for Windows, .deb and AppImage for Linux, the
  # universal .dmg for macOS, and — since LT-311 — the offline Windows pair in
  # a job of its own below.
  bundle:
    name: bundle (${{ matrix.os }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # LT-398: the NSIS installer only — "don't build any installer yet
          # please except the NSIS for windows". The seventh change to this
          # set (LT-305, LT-311, LT-331, LT-337, LT-349, LT-394, LT-398), and
          # like every one before it, one edit that deletes nothing.
          # - os: ubuntu-latest
          #   artifact: coreview-linux
          #   bundles: deb,appimage
          #   paths: |
          #     target/release/bundle/deb/*.deb
          #     target/release/bundle/appimage/*.AppImage
          - os: windows-latest
            artifact: coreview-windows
            bundles: nsis
            paths: |
              target/release/bundle/nsis/*.exe
              target/release/bundle/nsis/SHA256SUMS.txt
              target/release/bundle/nsis/sbom/*.json
              target/release/bundle/nsis/*.crt
              target/release/bundle/nsis/*.cer
            #  target/release/bundle/msi/*.msi
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Linux build dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libsoup-3.0-dev libssl-dev libdbus-1-dev \
            libxdo-dev libayatana-appindicator3-dev librsvg2-dev \
            build-essential curl wget file pkg-config \
            xdg-utils

      - run: npm ci

      # Signs when a certificate is configured, and quietly does not when it is
      # not, so forks and pull requests still build.
      - name: Prepare code signing
        if: matrix.os == 'windows-latest'
        uses: ./.github/actions/sign-windows
        with:
          certificate: ${{ secrets.WINDOWS_CERTIFICATE }}
          password: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}

      # LT-519, D-060: the collector sidecar — the embeddable CPython from
      # python.org (checksum pinned in the script), the hashed wheels, the
      # package — laid as a plain folder under src-tauri/sidecar/, every PE in
      # it signed (sign.ps1; Tauri signs only its own exe and the installer),
      # and shipped by tauri.sidecar.conf.json as a resource. No PyInstaller,
      # no UPX, nothing that unpacks itself into %TEMP%.
      - uses: actions/setup-python@v6
        if: matrix.os == 'windows-latest'
        with:
          python-version: '3.12'

      - name: Lay the collector sidecar
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: sidecar/build/windows.ps1

      - name: Sign the collector sidecar
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: sidecar/build/sign.ps1

      # This one carries a WebView2 *bootstrapper* rather than the runtime: the
      # runtime itself goes in both the NSIS exe and the MSI and takes them
      # past 500 MB, for a 7.8 MB application. WebView2 ships with Windows 11
      # and with Edge on Windows 10, so the bootstrapper almost never has
      # anything to fetch — this is the installer nearly everyone wants. The
      # machine with no internet *and* no WebView2 is served by
      # `bundle-windows-offline` below (LT-311).
      #
      # rusqlite is built with `bundled`, so there is no external SQLite.
      # LT-528: the SBOM tools. cargo-auditable embeds the exact dependency
      # list in coreview.exe; cargo-audit reads it back from the shipped binary;
      # cargo-cyclonedx writes the Rust SBOM.
      - name: Install SBOM tools
        if: matrix.os == 'windows-latest'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-auditable,cargo-audit,cargo-cyclonedx

      - name: Build bundles
        run: npm run tauri build -- --bundles ${{ matrix.bundles }} ${{ matrix.os == 'windows-latest' && '--config src-tauri/tauri.sidecar.conf.json --runner scripts/sbom/cargo-auditable-runner.cmd' || '' }}

      # LT-528, D-060: an SBOM for everything the installer carries — the Rust
      # executable (CycloneDX, and its embedded list audited), the sidecar's
      # Python (pip-audit, CycloneDX, failing on any advisory not written up in
      # sidecar/pip-audit-ignore.txt) and the page's npm packages (CycloneDX).
      - name: SBOM and audit of what shipped
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $out = "target/release/bundle/nsis/sbom"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          cargo audit bin target/release/coreview.exe
          if ($LASTEXITCODE -ne 0) { Write-Host "::error title=SBOM::cargo audit found advisories in coreview.exe"; exit 1 }
          Push-Location src-tauri
          cargo cyclonedx --format json --target x86_64-pc-windows-msvc --override-filename coreview-rust.cdx
          Pop-Location
          Move-Item src-tauri/coreview-rust.cdx.json "$out/coreview-rust.cdx.json"
          python -m pip install --disable-pip-version-check -q pip-audit==2.10.1
          $ignore = Get-Content sidecar/pip-audit-ignore.txt | Where-Object { $_ -match '^[A-Z]' } | ForEach-Object { "--ignore-vuln"; ($_ -split '\s')[0] }
          python -m pip_audit -r sidecar/requirements.txt --require-hashes --disable-pip @ignore --format cyclonedx-json -o "$out/sidecar-python.cdx.json"
          if ($LASTEXITCODE -ne 0) { Write-Host "::error title=SBOM::pip-audit found an advisory in the sidecar that is not written up in sidecar/pip-audit-ignore.txt"; exit 1 }
          npx --yes @cyclonedx/cyclonedx-npm@6.0.1 --omit dev --output-format JSON --output-file "$out/page-npm.cdx.json"
          Write-Host "::notice title=SBOM::$((Get-ChildItem $out).Name -join ', ')"

      # LT-519, D-060: every Windows installer is scanned before it is
      # published, and a single detection fails the build. Skipped with a
      # notice when no VIRUSTOTAL_API_KEY secret is set.
      - name: VirusTotal
        if: matrix.os == 'windows-latest'
        shell: pwsh
        env:
          VIRUSTOTAL_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
        run: |
          # The public halves of the certificates, beside the installer, for the
          # install notes (docs/INSTALL-WINDOWS.md). Never a private key.
          Copy-Item brand/coreview-root-ca.crt target/release/bundle/nsis/coreview-root-ca.crt
          if ($env:COREVIEW_SIGN_THUMBPRINT) {
            Export-Certificate -Cert "Cert:\CurrentUser\My\$env:COREVIEW_SIGN_THUMBPRINT" -FilePath target/release/bundle/nsis/coreview-code-signing.cer -Type CERT | Out-Null
          }
          foreach ($exe in Get-ChildItem target/release/bundle/nsis/*.exe) {
            ./.github/actions/virustotal/scan.ps1 -Path $exe.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            "$((Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower())  $($exe.Name)" | Out-File -Append -Encoding ascii target/release/bundle/nsis/SHA256SUMS.txt
          }

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.paths }}
          if-no-files-found: error

  # LT-311, asked for on 2026-09-18 — "also build the offline installer".
  #
  # The same application, bundled with `webviewInstallMode: offlineInstaller`,
  # so the WebView2 runtime is *inside* the installer and setup needs no
  # internet at all. That is what takes it past 500 MB, which is why it was
  # held back from 2026-09-12 (LT-123) until he asked for it.
  #
  # A job of its own rather than another matrix leg: it builds the same commit
  # twice on the same runner kind, and keeping it separate means a failure here
  # never holds up the installer everyone else uses.
  bundle-windows-offline:
    name: bundle (Windows, offline installer)
    needs: test
    # LT-398: paused again with the rest — NSIS only.
    if: false
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      - name: Prepare code signing
        uses: ./.github/actions/sign-windows
        with:
          certificate: ${{ secrets.WINDOWS_CERTIFICATE }}
          password: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}

      # `--config` merges over tauri.conf.json rather than replacing it, so the
      # offline build differs from the ordinary one in exactly one field and
      # cannot drift in any other.
      - name: Build the offline installers
        run: npx tauri build --config src-tauri/tauri.offline.conf.json

      - uses: actions/upload-artifact@v7
        with:
          name: coreview-windows-offline
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
          if-no-files-found: error

  # macOS, for the same reason Windows has its own runner: Tauri cannot
  # cross-compile a macOS bundle, and building a .dmg needs `hdiutil`, which
  # exists nowhere but macOS. So nothing about this job can be reproduced on
  # the Linux machine this repo is developed on — the CI run is the only place
  # it is ever built, and only a Mac can confirm it opens.
  #
  # Universal rather than the runner's own Apple Silicon: an Intel Mac cannot
  # run an arm64 build at all, and "which Mac is it" is not a question a
  # download gets to ask. It costs a second compile of the same code.
  #
  # Unsigned, because there is no Apple Developer certificate to sign with
  # (unlike Windows, which has one). macOS quarantines a downloaded app that
  # nobody has notarised and calls it "damaged", which it is not — the step
  # that clears it is written down in docs/HANDOVER.md rather than left to be
  # discovered.
  #
  # Its own job, so a platform that cannot be tested from here can never
  # fail the bundles that can.
  bundle-macos:
    name: bundle (macOS, universal .dmg)
    needs: test
    # LT-399: asked for on its own — "can you build the macos". The Windows
    # NSIS and this one; Linux, the MSI and the offline installer stay paused.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - run: npm ci

      - name: Build bundles
        run: npm run tauri build -- --target universal-apple-darwin

      - uses: actions/upload-artifact@v7
        with:
          name: coreview-macos
          path: target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error

  # Does the AppImage carry WebKit, or does it quietly rely on the build host
  # having it? That is the claim worth testing, and the only one an AppImage
  # actually makes: the format deliberately excludes the graphics stack,
  # because libGL is driver-coupled and bundling it breaks acceleration on the
  # host. So the container gets a minimal *desktop* runtime — X, GL, fonts,
  # the things any real machine has — and pointedly NOT libwebkit2gtk-4.1-0,
  # libgtk-3-0 or anything -dev. If the app starts, it started on its own
  # WebKit.
  #
  # The first version of this job installed nothing but xvfb and expected the
  # app to run, which no desktop application could have done.
  appimage-smoke:
    name: AppImage on a machine without WebKit
    needs: bundle
    # LT-398: no AppImage to test while the Linux bundle is paused.
    if: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: coreview-linux
          path: dist-artifacts

      - name: Launch under a bare container
        run: |
          find dist-artifacts -name '*.AppImage' -exec chmod +x {} \;
          APPIMAGE=$(find dist-artifacts -name '*.AppImage' | head -1)
          test -n "$APPIMAGE" || { echo "no AppImage in the artifact"; exit 1; }
          echo "testing $APPIMAGE"
          docker run --rm -v "$PWD:/w" -w /w ubuntu:24.04 bash -eux -c '
            apt-get update -qq
            # A minimal desktop runtime. No FUSE package: --appimage-extract
            # does not use FUSE, and 24.04 renamed it libfuse2t64 anyway, which
            # is what broke the first version of this job.
            apt-get install -y -qq --no-install-recommends               xvfb ca-certificates               libgl1 libegl1 libgbm1 libdrm2               libx11-6 libx11-xcb1 libxcb1 libxrandr2 libxi6               libfontconfig1 libfreetype6 libharfbuzz0b libfribidi0 fonts-dejavu-core
            # Prove the host really has no WebKit of its own.
            ! ldconfig -p | grep -q libwebkit2gtk || { echo "host already has WebKit; test proves nothing"; exit 1; }
            chmod +x '"$APPIMAGE"'
            '"$APPIMAGE"' --appimage-extract >/dev/null
            # WebKitGTK will not realise its window without these where there
            # is no GPU; verified locally, where it otherwise sits at an
            # unmapped 10x10 placeholder and prints nothing at all.
            export WEBKIT_DISABLE_DMABUF_RENDERER=1
            export WEBKIT_DISABLE_COMPOSITING_MODE=1
            export LIBGL_ALWAYS_SOFTWARE=1
            # Keep the output: a smoke test that cannot say why it failed is
            # not worth having.
            timeout 40 xvfb-run -a ./squashfs-root/AppRun >/tmp/app.log 2>&1 &
            PID=$!
            sleep 25
            if kill -0 $PID 2>/dev/null; then
              echo "AppImage stayed up for 25s using its own bundled WebKit"
              kill $PID
            else
              echo "AppImage exited early; its output was:"
              cat /tmp/app.log || true
              exit 1
            fi
          '
