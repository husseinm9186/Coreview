[package]
name = "coreview-catalog"
version = "2.4.9"
authors = ["Mohammed Almoola <https://www.linkedin.com/in/malmoola>"]
edition = "2021"
rust-version = "1.77"
description = "The discovery catalog: one YAML per OS (resources/catalog), its loader and schema check, the gate evaluator, the collection plan and the read-only allowlist — no Tauri, no network (LT-512, D-060)"
license = "LicenseRef-Almoola-Free-Proprietary"
# Proprietary: never published to crates.io.
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
regex = "1"
# The prompt patterns extracted from scrapli use look-around, which `regex`
# refuses on purpose; they are compiled here only to prove they compile.
fancy-regex = "0.19"
thiserror = "1"
