[package]
name = "coreview-collect"
version = "2.4.9"
authors = ["Mohammed Almoola <https://www.linkedin.com/in/malmoola>"]
edition = "2021"
rust-version = "1.77"
description = "The catalog-driven collector (D-060 Phase 1, LT-514): fingerprint, capabilities, plan, run through the sidecar or a vendor's API, scrub, normalise into the discovery tables. No Tauri, no SQLite."
license = "LicenseRef-Almoola-Free-Proprietary"
# Proprietary: never published to crates.io.
publish = false

[dependencies]
coreview-catalog = { path = "../coreview-catalog" }
# LT-596: the classic crawler's FortiOS readers that have met hardware
# (the wireless controller's APs), rather than a second copy of them.
coreview-discover = { path = "../coreview-discover" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "process", "io-util", "sync", "rt", "rt-multi-thread", "time"] }
tokio-util = "0.7"
regex = "1"
fancy-regex = "0.19"
thiserror = "1"
sha2 = "0.10"
# The API collectors (FortiOS REST, PAN-OS XML API, AOS-CX REST) — rustls
# with the aws-lc provider the workspace already carries through russh.
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "cookies", "http2", "query"] }
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs", "std", "tls12"] }
rustls-pki-types = "1"
roxmltree = "0.20"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
# A fake switch for the real sidecar to log into (tests/real_sidecar_against_a_fake_switch.rs).
russh = "0.63"
rand = "0.10"
# LT-518: a local TLS server with throwaway certificates made at test time,
# so no private key is ever committed.
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs", "pem"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws-lc-rs", "tls12"] }
base64 = "0.22"
