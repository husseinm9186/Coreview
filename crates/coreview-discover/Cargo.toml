[package]
name = "coreview-discover"
version = "0.2.0"
authors = ["Mohammed Almoola <https://www.linkedin.com/in/malmoola>"]
edition = "2021"
license = "LicenseRef-Almoola-Free-Proprietary"
# Proprietary: never published to crates.io.
publish = false
rust-version = "1.77"
description = "Device discovery and configuration backup. No Tauri dependency, so the credential handling and command construction are unit-testable on their own."

[dependencies]
coreview-probe = { path = "../coreview-probe" }
serde = { version = "1", features = ["derive"] }
thiserror = "1"
tokio = { version = "1", features = ["macros", "net", "time", "sync", "rt", "rt-multi-thread", "io-util"] }
tokio-util = "0.7"
russh = "0.63"
async-trait = "0.1"
# heap_buffers: without it every session carries two 65,507-byte buffers
# inline (about 131 KB), which overflowed a 2 MiB tokio worker in debug builds
# — a Tauri command's thread — whenever SNMP was used. Measured, LT-124.
snmp2 = { version = "0.5", features = ["v3", "heap_buffers"] }
argon2 = "0.5"
chacha20poly1305 = "0.10"
zeroize = { version = "1", features = ["derive"] }
getrandom = "0.2"
# LT-153: checks against captured output. Linear-time matching, so a pattern
# someone pastes cannot hang on a long `show` output. Already in the lock file
# through other crates.
regex = "1"

[dev-dependencies]
rand = "0.10"
serde_json = "1"
# LT-267: properties every parser keeps, on any input.
proptest = "1"
