[package]
name = "coreview-formats"
version = "2.4.9"
authors = ["Mohammed Almoola <https://www.linkedin.com/in/malmoola>"]
edition = "2021"
# The same floor as the other crates, so clippy holds every crate to one Rust.
rust-version = "1.77"
description = "File readers for Coreview: Visio .vsdx, draw.io and Nmap XML, read as devices and links — no Tauri, so they test with plain cargo (LT-457)"
license = "LicenseRef-Almoola-Free-Proprietary"
# Proprietary: never published to crates.io.
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
roxmltree = "0.20"
zip = { version = "4.2.0", default-features = false, features = ["deflate"] }
base64 = "0.22"
flate2 = "1"

[dev-dependencies]
proptest = "1"
