[package]
name = "coreview-meraki"
version = "2.5.0"
authors = ["Mohammed Almoola <https://www.linkedin.com/in/malmoola>"]
edition = "2021"
rust-version = "1.77"
description = "Read-only client for the Cisco Meraki Dashboard API: organisations, networks, devices and topology"
license = "LicenseRef-Almoola-Free-Proprietary"
# Proprietary: never published to crates.io.
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["macros", "net", "time", "rt", "io-util"] }
# The same TLS stack coreview-probe already uses, so no new crate reaches an
# installer: rustls with aws-lc-rs rather than an OpenSSL-backed one.
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs", "logging", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws-lc-rs", "logging", "tls12"] }
rustls-pki-types = "1"
webpki-roots = "1"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
