[package]
name = "coreview-path"
version = "2.5.0"
authors = ["Mohammed Almoola <https://www.linkedin.com/in/malmoola>"]
edition = "2021"
rust-version = "1.77"
description = "P3's path builder: a collection's discovery tables and P2's graph in, the path a packet would take out — policy routes, longest-prefix match per VRF, ECMP branches, recursive next hops, next hop to device through FHRP, ARP and MACs, the switches between routers, firewall NAT and policy in each vendor's order, the reverse path, what-if, and the comparison with a traceroute. Pure: no SQLite, no Tauri, no network."
license = "LicenseRef-Almoola-Free-Proprietary"
# Proprietary: never published to crates.io.
publish = false

[dependencies]
coreview-topology = { path = "../coreview-topology" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
# The end-to-end test: raw CLI output → the vendored templates → the table normaliser → the walk.
coreview-catalog = { path = "../coreview-catalog" }
coreview-collect = { path = "../coreview-collect" }
# The lab harness (examples/lab_run.rs) runs the real collector.
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
