# Coreview discovery catalog — Aruba (HPE) AOS-CX (aoscx)
#
# First built 2026-09-29 by scripts/build-catalog.mjs from the operator's
# specification (docs/DISCOVERY-SPEC.md), ntc-templates' index
# (resources/templates/ntc, ntc-templates 9.3.0), and the scrapli drivers
# (scrapli 2026.02.20, scrapli_community 2025.01.30) plus netmiko 4.8.0 where
# named. Maintained by hand from here on; catalog.test.ts holds every
# command to the ntc index and the read-only allowlist (LT-512).
#
# verified: lab = a real capture parses (ntc-templates' tests, or a
# Coreview reader that met the operator's hardware); docs = documented,
# structured, or a template with no fixture; unverified = no template, no
# structured output, no capture yet — LT-511's list. Never invent a command.
vendor: Aruba (HPE)
os: aoscx
name: AOS-CX
ntc_platform: aruba_aoscx
phase: 1
fingerprint:
  probe: show version
  match_regex: ArubaOS-CX
session:
  source: scrapli_community generic 'network' driver
  privilege_levels:
    privilege_exec:
      pattern: ^[\w.\-@/:]{1,63}#\s?$
  default_privilege: privilege_exec
  failed_when_contains:
    - "% Command incomplete."
    - "Invalid input:"
    - doesn't exist
  on_open:
    - no page
  on_close:
    - exit
  ntc_platform: aruba_aoscx
  paging:
    off:
      - no page
    source: scrapli_community aruba_aoscx on_open; netmiko aruba_aoscx.py session_preparation; Coreview arubacx dialect (verified on the lab 6200F)
  ansi:
    strip: true
    source: netmiko aruba_aoscx.py ansi_escape_codes = True
role_hint:
  - match: \b(6[0-4]\d\d|8[0-4]\d\d|10000)\b
    role: switch
role_defaults:
  switch:
    - switching
    - lldp
caps_probe:
  - id: show_running_config_include_router_vrf_vrrp_active_gateway_i
    cmd: show running-config | include ^router |^vrf |^vrrp|^active-gateway|^interface vxlan|^evpn|^vsx|^vsf|^ip route |^interface lag
    flags:
      routing: "^router |^ip route "
      ospf: ^router ospf
      bgp: ^router bgp
      vrf: ^vrf (?!mgmt)
      fhrp: ^vrrp|^active-gateway
      vxlan_evpn: ^interface vxlan|^evpn
      vpc_mlag_vsx: ^vsx
      stack: ^vsf
      switching: ^interface lag
    timeout: 30
commands:
  - id: show_version
    cmd: show version
    gate: always
    parser: api
    api: /rest/v10.xx/firmware
    feeds:
      - device
    weight: light
    timeout: 30
    verified: lab
    evidence: Coreview aoscx reader, met the operator's hardware
    coreview_reader: true
