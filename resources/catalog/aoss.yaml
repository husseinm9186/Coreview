# Coreview discovery catalog — Aruba (HPE) ArubaOS-Switch / ProCurve (aoss)
#
# First built 2026-09-29 by scripts/build-catalog.mjs from the operator's
# specification (docs/DISCOVERY-SPEC.md), ntc-templates' index
# (resources/templates/ntc, ntc-templates 9.3.0), and the scrapli drivers
# (scrapli 2026.02.20, scrapli_community 2025.01.30) plus netmiko 4.8.0 where
# named. Maintained by hand from here on; catalog.test.ts holds every
# command to the ntc index and the read-only allowlist (LT-512).
#
# verified: lab = a real capture parses (ntc-templates' tests, or a
# Coreview reader that met the operator's hardware); docs = documented,
# structured, or a template with no fixture; unverified = no template, no
# structured output, no capture yet — LT-511's list. Never invent a command.
vendor: Aruba (HPE)
os: aoss
name: ArubaOS-Switch / ProCurve
ntc_platform: hp_procurve
phase: 1
fingerprint:
  probe: show system
  match_regex: Software revision|ProCurve|Aruba
session:
  banner:
    prompt: any key to continue
    answer: ""
    source: netmiko hp_procurve.py session_preparation
  prompt_pattern: "[>#]"
  privilege_levels:
    exec:
      pattern: ^[\w.\-@/:()]{1,63}>\s?$
    privilege_exec:
      pattern: ^[\w.\-@/:()]{1,63}#\s?$
      escalate: enable
      escalate_auth: true
      escalate_prompt: (username|login|user name|password)
      source: "netmiko hp_procurve.py enable: may ask for the username before the password"
  default_privilege: privilege_exec
  paging:
    off:
      - terminal width 511
      - no page
    needs_enable: true
    source: netmiko hp_procurve.py session_preparation ("requires elevated privileges to disable output paging"); Coreview arubasw dialect (verified on the lab 2930M)
  on_close:
    steps:
      - logout
    confirm:
      prompt: Do you want
      answer: y
    source: netmiko hp_procurve.py cleanup
  ansi:
    strip: true
    source: netmiko hp_procurve.py ansi_escape_codes = True
  ssh_note: netmiko hp_procurve.py disables rsa-sha2-256/512 pubkey algorithms; kex quirks on old firmware are LT-488
  failed_when_contains:
    - "Invalid input:"
    - "Incomplete input:"
    - "Ambiguous input:"
  source: netmiko hp_procurve.py (no scrapli platform in the pinned release)
role_hint:
  - match: 2530|2540|2920|2930|3810|5400|J[89]\d{3}A
    role: switch
role_defaults:
  switch:
    - switching
    - lldp
    - cdp
caps_probe:
  - id: show_running_config_include_ip_routing_router_ip_route_vrrp_
    cmd: show running-config | include ^ip routing|^router |^ip route |^vrrp|^trunk |^stacking
    flags:
      routing: "^ip routing|^router |^ip route "
      ospf: ^router ospf
      bgp: ^router bgp
      rip: ^router rip
      fhrp: ^vrrp
      switching: "^trunk "
      stack: ^stacking
    timeout: 30
commands:
  - id: show_system
    cmd: show system
    gate: always
    parser: textfsm:hp_procurve_show_system
    feeds:
      - device
    weight: light
    timeout: 30
    verified: lab
    evidence: ntc-templates tests (3 captures); Coreview aoss reader
    coreview_reader: true
  - id: show_version
