# Coreview discovery catalog — Arista EOS (arista_eos)
#
# First built 2026-09-29 by scripts/build-catalog.mjs from the operator's
# specification (docs/DISCOVERY-SPEC.md), ntc-templates' index
# (resources/templates/ntc, ntc-templates 9.3.0), and the scrapli drivers
# (scrapli 2026.02.20, scrapli_community 2025.01.30) plus netmiko 4.8.0 where
# named. Maintained by hand from here on; catalog.test.ts holds every
# command to the ntc index and the read-only allowlist (LT-512).
#
# verified: lab = a real capture parses (ntc-templates' tests, or a
# Coreview reader that met the operator's hardware); docs = documented,
# structured, or a template with no fixture; unverified = no template, no
# structured output, no capture yet — LT-511's list. Never invent a command.
vendor: Arista
os: arista_eos
name: EOS
ntc_platform: arista_eos
phase: 1
fingerprint:
  probe: show version
  match_regex: Arista
session:
  source: scrapli scrapli.driver.core.arista_eos.sync_driver.EOSDriver
  privilege_levels:
    exec:
      pattern: "^[\\w.\\-@()/: ]{1,63}>\\s?$"
    privilege_exec:
      pattern: "^[\\w.\\-@()/: ]{1,63}#\\s?$"
      escalate: enable
      escalate_auth: true
      escalate_prompt: ^[pP]assword:\s?$
      previous: exec
  failed_when_contains:
    - "% Ambiguous command"
    - "% Error"
    - "% Incomplete command"
    - "% Invalid input"
    - "% Cannot commit"
    - "% Unavailable command"
    - "% Duplicate sequence number"
  on_open:
    - terminal length 0
    - terminal width 32767
  on_close:
    - exit
  ntc_platform: arista_eos
  paging:
    off:
      - terminal length 0
      - terminal width 511
    source: scrapli EOSDriver on_open; netmiko arista.py session_preparation
  structured:
    suffix: " | json"
    source: "spec: `| json` on everything (or eAPI if enabled)"
  default_privilege: privilege_exec
role_hint:
  - match: DCS-7|CCS-7|vEOS
    role: switch
role_defaults:
  switch:
    - switching
    - lldp
    - structured_output
caps_probe:
  - id: show_running_config_include_router_ip_routing_vrf_instance_i
    cmd: show running-config | include ^router |^ip routing|^vrf instance|^ip virtual-router|^vrrp|^interface Vxlan|^mlag|^policy-map type pbr|^interface Tunnel|^ip route
    flags:
      routing: ^router |^ip routing|^ip route
      ospf: ^router ospf
      bgp: ^router bgp
      isis: ^router isis
      vrf: ^vrf instance
      fhrp: ^ip virtual-router|^vrrp
      vxlan_evpn: ^interface Vxlan
      vpc_mlag_vsx: ^mlag
      pbr: ^policy-map type pbr
      gre: ^interface Tunnel
    timeout: 30
commands:
  - id: show_version
    cmd: show version
    gate: always
    parser: json
    shadow: textfsm:arista_eos_show_version
    feeds:
      - device
    weight: light
    timeout: 30
    verified: lab
    evidence: ntc-templates tests (5 captures)
