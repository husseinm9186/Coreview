# Coreview discovery catalog — Cisco ASA / FTD (cisco_asa)
#
# First built 2026-09-29 by scripts/build-catalog.mjs from the operator's
# specification (docs/DISCOVERY-SPEC.md), ntc-templates' index
# (resources/templates/ntc, ntc-templates 9.3.0), and the scrapli drivers
# (scrapli 2026.02.20, scrapli_community 2025.01.30) plus netmiko 4.8.0 where
# named. Maintained by hand from here on; catalog.test.ts holds every
# command to the ntc index and the read-only allowlist (LT-512).
#
# verified: lab = a real capture parses (ntc-templates' tests, or a
# Coreview reader that met the operator's hardware); docs = documented,
# structured, or a template with no fixture; unverified = no template, no
# structured output, no capture yet — LT-511's list. Never invent a command.
vendor: Cisco
os: cisco_asa
name: ASA / FTD
ntc_platform: cisco_asa
phase: 1
fingerprint:
  probe: show version
  match_regex: Adaptive Security Appliance|Firepower Threat Defense
session:
  source: scrapli_community generic 'network' driver
  privilege_levels:
    exec:
      pattern: ^[\w\./-]{1,63}>\s?$
    privilege_exec:
      pattern: ^[\w\./-]{1,63}#\s?$
      escalate: enable
      escalate_auth: true
      escalate_prompt: ^(P|p)assword:\s?$
      previous: exec
  default_privilege: privilege_exec
  failed_when_contains:
    - "% Invalid input detected"
    - "% Ambiguous command"
    - "% Incomplete command"
  on_open:
    - terminal pager 0
  on_close:
    - logout
  ntc_platform: cisco_asa
  paging:
    off:
      - terminal pager 0
    source: scrapli_community cisco_asa on_open; netmiko cisco_asa_ssh.py session_preparation
  contexts:
    kind: context
    detect:
      cmd: show mode
      match: "^Security context mode: multiple"
      source: spec
    list:
      cmd: show context
      match: ^\*?\s*(\S+)\s+\S+
      source: spec; unverified
    enter:
      - changeto context {ctx}
    leave:
      - changeto system
    reprompt: true
    source: netmiko cisco_asa_ssh.py send_command ("multi-context mode … base_prompt needs to be updated" after changeto)
role_hint:
  - match: ASA|FPR|Firepower
    role: firewall
role_defaults:
  firewall:
    - routing
    - nat
    - ha
caps_probe:
  - id: show_mode
    cmd: show mode
    flags:
      multi_context: "^Security context mode: multiple"
    timeout: 30
  - id: show_running_config_include_router_route_nat_crypto_map_tunn
    cmd: show running-config | include ^router |^route |^nat |^crypto map|^tunnel-group|^vrf
    flags:
      routing: "^router |^route "
      ospf: ^router ospf
      eigrp: ^router eigrp
      bgp: ^router bgp
      nat: "^nat "
      ipsec: ^crypto map|^tunnel-group
      vrf: "^vrf "
    timeout: 30
commands:
  - id: show_version
    cmd: show version
    gate: always
    parser: textfsm:cisco_asa_show_version
    feeds:
      - device
    weight: light
    timeout: 30
    verified: lab
    evidence: ntc-templates tests (4 captures)
    coreview_reader: true
