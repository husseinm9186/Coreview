# Coreview discovery catalog — Cisco IOS / IOS-XE (cisco_ios)
#
# First built 2026-09-29 by scripts/build-catalog.mjs from the operator's
# specification (docs/DISCOVERY-SPEC.md), ntc-templates' index
# (resources/templates/ntc, ntc-templates 9.3.0), and the scrapli drivers
# (scrapli 2026.02.20, scrapli_community 2025.01.30) plus netmiko 4.8.0 where
# named. Maintained by hand from here on; catalog.test.ts holds every
# command to the ntc index and the read-only allowlist (LT-512).
#
# verified: lab = a real capture parses (ntc-templates' tests, or a
# Coreview reader that met the operator's hardware); docs = documented,
# structured, or a template with no fixture; unverified = no template, no
# structured output, no capture yet — LT-511's list. Never invent a command.
vendor: Cisco
os: cisco_ios
name: IOS / IOS-XE
ntc_platform: cisco_ios
phase: 1
fingerprint:
  probe: show version
  match_regex: Cisco IOS(-| )XE Software|Cisco IOS Software
session:
  source: scrapli scrapli.driver.core.cisco_iosxe.sync_driver.IOSXEDriver
  privilege_levels:
    exec:
      pattern: ^[\w.\-@/:]{1,63}>\s*$
    privilege_exec:
      pattern: ^[\w.\-@/:]{1,63}#\s*$
      escalate: enable
      escalate_auth: true
      escalate_prompt: ^(?:enable\s){0,1}password:\s?$
      previous: exec
  failed_when_contains:
    - "% Ambiguous command"
    - "% Incomplete command"
    - "% Invalid input detected"
    - "% Unknown command"
  on_open:
    - terminal length 0
    - terminal width 512
  on_close:
    - exit
  ntc_platform: cisco_ios
  paging:
    off:
      - terminal length 0
      - terminal width 511
    source: scrapli IOSXEDriver on_open; netmiko cisco_ios.py session_preparation (terminal width 511)
  default_privilege: privilege_exec
role_hint:
  - match: C9[2-6]\d\d|C3[5678]50|C2960|WS-C|C4[59]00|C6[58]00
    role: switch
  - match: ISR|ASR1|CSR1|C8[0-5]00
    role: router
  - match: C9800
    role: wlc
role_defaults:
  switch:
    - switching
    - cdp
    - lldp
    - stack
  router:
    - routing
    - cdp
    - lldp
  wlc:
    - wlc
    - cdp
    - lldp
caps_probe:
  - id: show_ip_protocols
    cmd: show ip protocols
    flags:
      ospf: ^Routing Protocol is "ospf
      eigrp: ^Routing Protocol is "eigrp
      bgp: ^Routing Protocol is "bgp
      isis: ^Routing Protocol is "isis
      rip: ^Routing Protocol is "rip
      routing: ^Routing Protocol is "
    timeout: 30
  - id: show_run_include_ip_routing_router_ip_route_vrf_definition_i
    cmd: show run | include ^ip routing|^router |^ip route |^vrf definition|^ip vrf |^interface Tunnel|^ip nat |^crypto |^ip policy|^mpls |^interface Port-channel|^ standby|^ vrrp|^ glbp
    flags:
      routing: "^ip routing|^router |^ip route "
      ospf: ^router ospf
      eigrp: ^router eigrp
      bgp: ^router bgp
      isis: ^router isis
      rip: ^router rip
      vrf: "^vrf definition|^ip vrf "
      gre: ^interface Tunnel
      nat: "^ip nat "
      ipsec: "^crypto "
      pbr: ^ip policy
      mpls: "^mpls "
      switching: ^interface Port-channel
      fhrp: ^ standby|^ vrrp|^ glbp
      dmvpn: ^interface Tunnel
    timeout: 30
