# Coreview discovery catalog — Cisco IOS XR (cisco_iosxr)
#
# First built 2026-09-29 by scripts/build-catalog.mjs from the operator's
# specification (docs/DISCOVERY-SPEC.md), ntc-templates' index
# (resources/templates/ntc, ntc-templates 9.3.0), and the scrapli drivers
# (scrapli 2026.02.20, scrapli_community 2025.01.30) plus netmiko 4.8.0 where
# named. Maintained by hand from here on; catalog.test.ts holds every
# command to the ntc index and the read-only allowlist (LT-512).
#
# verified: lab = a real capture parses (ntc-templates' tests, or a
# Coreview reader that met the operator's hardware); docs = documented,
# structured, or a template with no fixture; unverified = no template, no
# structured output, no capture yet — LT-511's list. Never invent a command.
vendor: Cisco
os: cisco_iosxr
name: IOS XR
ntc_platform: cisco_xr
phase: 1
fingerprint:
  probe: show version
  match_regex: Cisco IOS XR Software
session:
  source: scrapli scrapli.driver.core.cisco_iosxr.sync_driver.IOSXRDriver
  privilege_levels:
    privilege_exec:
      pattern: ^[\w.\-@/:]{1,63}#\s?$
  failed_when_contains:
    - "% Ambiguous command"
    - "% Incomplete command"
    - "% Invalid input detected"
  on_open:
    - terminal length 0
    - terminal width 512
  on_close:
    - exit
  ntc_platform: cisco_xr
  paging:
    off:
      - terminal length 0
      - terminal width 511
    source: scrapli IOSXRDriver on_open; netmiko cisco_xr.py session_preparation
  default_privilege: privilege_exec
role_hint:
  - match: ASR9|NCS|CRS|XRv
    role: router
role_defaults:
  router:
    - routing
    - lldp
    - cdp
caps_probe:
  - id: show_run_include_router_route_policy_vrf_interface_tunnel_mp
    cmd: show run | include ^router |^route-policy|^vrf |^interface tunnel|^mpls|^l2vpn|^evpn
    flags:
      routing: "^router "
      ospf: ^router ospf
      bgp: ^router bgp
      isis: ^router isis
      pbr: ^route-policy
      vrf: "^vrf "
      gre: ^interface tunnel
      mpls: ^mpls
      l2vpn: ^l2vpn|^evpn
      vxlan_evpn: ^evpn
    timeout: 30
commands:
  - id: show_version
    cmd: show version
    gate: always
    parser: textfsm:cisco_xr_show_version
    feeds:
      - device
    weight: light
    timeout: 30
    verified: lab
    evidence: ntc-templates tests (5 captures)
  - id: show_inventory
    cmd: show inventory
    gate: always
    parser: textfsm:cisco_xr_admin_show_inventory
