# Coreview discovery catalog — Cisco NX-OS (cisco_nxos)
#
# First built 2026-09-29 by scripts/build-catalog.mjs from Coreview's discovery
# specification, ntc-templates' index
# (resources/templates/ntc, ntc-templates 9.3.0), and the scrapli drivers
# (scrapli 2026.02.20, scrapli_community 2025.01.30) plus netmiko 4.8.0 where
# named. Maintained by hand from here on; catalog.test.ts holds every
# command to the ntc index and the read-only allowlist.
#
# verified: lab = a real capture parses (ntc-templates' tests, or a
# Coreview reader that met real hardware); docs = documented,
# structured, or a template with no fixture; unverified = no template, no
# structured output, no capture yet — the list. Never invent a command.
vendor: Cisco
os: cisco_nxos
name: NX-OS
ntc_platform: cisco_nxos
phase: 1
fingerprint:
  probe: show version
  # Not `MLNX-OS`, which an older Onyx switch calls itself.
  match_regex: Cisco Nexus Operating System|(^|[^A-Z])NX-OS
session:
  source: scrapli scrapli.driver.core.cisco_nxos.sync_driver.NXOSDriver
  privilege_levels:
    exec:
      pattern: ^[\w.\-]{1,63}(\(maint\-mode\))?>\s?$
    privilege_exec:
      pattern: ^[\w.\-]{1,63}(\(maint\-mode\))?#\s?$
      escalate: enable
      escalate_auth: true
      escalate_prompt: ^[pP]assword:\s?$
      previous: exec
  failed_when_contains:
    - "% Ambiguous command"
    - "% Incomplete command"
    - "% Invalid input detected"
    - "% Invalid command at"
    - "% Invalid parameter"
  on_open:
    - terminal length 0
    - terminal width 511
  on_close:
    - exit
  ntc_platform: cisco_nxos
  paging:
    off:
      - terminal length 0
      - terminal width 511
    source: scrapli NXOSDriver on_open; netmiko cisco_nxos.py session_preparation
  structured:
    suffix: " | json"
    source: "spec: append `| json` wherever supported (TextFSM fallback)"
  default_privilege: privilege_exec
role_hint:
  - match: Nexus|N[3579]K|N9K
    role: switch
role_defaults:
  switch:
    - switching
    - cdp
    - lldp
    - structured_output
caps_probe:
  - id: show_feature
    cmd: show feature
    flags:
      ospf: ^ospf\s+\d+\s+enabled
      eigrp: ^eigrp\s+\d+\s+enabled
      bgp: ^bgp\s+\d+\s+enabled
      isis: ^isis\s+\d+\s+enabled
      vpc_mlag_vsx: ^vpc\s+\d+\s+enabled
      vpc: ^vpc\s+\d+\s+enabled
      switching: ^lacp\s+\d+\s+enabled|^interface-vlan\s+\d+\s+enabled
      fhrp: ^hsrp_engine\s+\d+\s+enabled|^vrrp\s+\d+\s+enabled
      lldp: ^lldp\s+\d+\s+enabled
      fex: ^fex\s+\d+\s+enabled
      vxlan_evpn: ^nv overlay\s+\d+\s+enabled|^vn-segment-vlan-based\s+\d+\s+enabled
      mpls: ^mpls\S*\s+\d+\s+enabled
      routing: ^(ospf|eigrp|bgp|isis|rip)\s+\d+\s+enabled
    timeout: 30
    parser: textfsm:cisco_nxos_show_feature
  - id: show_run_include_ip_route_route_map_interface_tunnel_ip_poli
    cmd: show run | include ^ip route |^route-map|^interface Tunnel|^ip policy|^vrf context
    flags:
      routing: "^ip route "
      pbr: ^ip policy|^route-map
      gre: ^interface Tunnel
      vrf: ^vrf context (?!management)
    timeout: 30
