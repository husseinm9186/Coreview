# Coreview discovery catalog — Cisco Small Business Sx300/Sx350/Sx500/CBS (cisco_s300)
#
# LT-663, 2026-10-01: the SG/CBS switches, whose CLI is not IOS — `show
# system`, `show system id`, `terminal datadump`. Commands and parsers from
# ntc-templates (their fixtures vendored), the session from netmiko's
# cisco_s300.py (D-058). First device to come.
#
# verified: lab = a real capture parses (ntc-templates' tests, or a
# Coreview reader that met the operator's hardware); docs = documented,
# structured, or a template with no fixture; unverified = no template, no
# structured output, no capture yet — LT-511's list. Never invent a command.
vendor: Cisco
os: cisco_s300
name: Small Business Sx300/Sx350/Sx500/CBS
ntc_platform: cisco_s300
phase: 1
fingerprint:
  probe: show version
  match_regex: '^SW version\s'
session:
  prompt_pattern: '^[\w.\-]+(\(config[^)]*\))?[>#]\s?$'
  privilege_levels:
    exec:
      pattern: '^[\w.\-]+>\s?$'
    privilege_exec:
      pattern: '^[\w.\-]+#\s?$'
      escalate: enable
      escalate_auth: true
      escalate_prompt: (?i)password
      previous: exec
  default_privilege: privilege_exec
  paging:
    off:
      - terminal datadump
      - terminal width 511
    source: netmiko cisco_s300.py session_preparation
  on_close:
    - exit
  failed_when_contains:
    - "% Unrecognized command"
    - "% Wrong number of parameters"
    - "% Incomplete command"
    - "% Ambiguous command"
    - "% Invalid input"
  source: netmiko cisco_s300.py (no scrapli platform)
role_hint:
  - match: SW version
    role: switch
role_defaults:
  switch:
    - switching
    - lldp
caps_probe: []
commands:
  - id: show_version
    cmd: show version
    gate: always
    parser: textfsm:cisco_s300_show_version
    feeds:
      - device
    weight: light
    timeout: 30
    verified: lab
    evidence: ntc-templates tests (2 captures)
  - id: show_system
    cmd: show system
    gate: always
    parser: textfsm:cisco_s300_show_system
    feeds:
      - device
    weight: light
    timeout: 30
    verified: lab
    evidence: ntc-templates tests (1 captures)
  - id: show_system_id
    cmd: show system id
    gate: always
    parser: textfsm:cisco_s300_show_system_id
    feeds:
      - device
    weight: light
    timeout: 30
    verified: lab
    evidence: ntc-templates tests (1 captures)
  - id: show_interfaces_status
    cmd: show interfaces status
    gate: always
    parser: textfsm:cisco_s300_show_interfaces_status
    feeds:
      - interface
    weight: light
    timeout: 30
    verified: lab
    evidence: ntc-templates tests (1 captures)
  - id: show_interfaces_description
    cmd: show interfaces description
    gate: always
    parser: textfsm:cisco_s300_show_interfaces_description
    feeds:
      - interface
    weight: light
    timeout: 30
    verified: lab
    evidence: ntc-templates tests (1 captures)
  - id: show_interfaces_switchport
    cmd: show interfaces switchport
    gate: always
    parser: textfsm:cisco_s300_show_interfaces_switchport
    feeds:
      - interface
    weight: heavy
    timeout: 120
    verified: lab
    evidence: ntc-templates tests (1 captures)
  - id: show_ip_interface
    cmd: show ip interface
    gate: always
    parser: textfsm:cisco_s300_show_ip_interface
    feeds:
      - ip_address
    weight: light
    timeout: 30
    verified: lab
    evidence: ntc-templates tests (2 captures)
  - id: show_lldp_neighbors
    cmd: show lldp neighbors
    gate: cap.lldp
    parser: textfsm:cisco_s300_show_lldp_neighbors
    feeds:
      - neighbor
    weight: light
    timeout: 30
    verified: lab
    evidence: ntc-templates tests (2 captures)
  - id: show_mac_address_table
    cmd: show mac address-table
    gate: always
    parser: textfsm:cisco_s300_show_mac_address-table
    feeds:
      - mac_table
    weight: heavy
    timeout: 120
    verified: lab
    evidence: ntc-templates tests (1 captures)
  - id: show_vlan
    cmd: show vlan
    gate: always
    parser: textfsm:cisco_s300_show_vlan
    feeds:
      - vlan
    weight: light
    timeout: 30
    verified: lab
    evidence: ntc-templates tests (2 captures)
  - id: show_running_config
    cmd: show running-config
    gate: always
    parser: raw
    feeds:
      - raw_config
    weight: heavy
    timeout: 120
    verified: docs
    evidence: a configuration; no parser to verify
live_path: []
note: 'LT-663: the small-business CLI. Built from ntc-templates and netmiko (D-058); no device met yet.'
