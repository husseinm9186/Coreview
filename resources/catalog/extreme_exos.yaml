# Coreview discovery catalog — Extreme EXOS (extreme_exos)
#
# Filled 2026-10-01 (LT-666): commands and parsers from ntc-templates (their
# fixtures vendored), the session from netmiko's extreme_exos.py — `disable
# clipaging`, `disable cli prompting`, a prompt that counts its commands
# (`* Switch.12 #`) (D-058). No device met yet; `show lldp neighbors` and
# `show iproute` have no template and stay unverified.
#
# verified: lab = a real capture parses (ntc-templates' tests, or a
# Coreview reader that met the operator's hardware); docs = documented,
# structured, or a template with no fixture; unverified = no template, no
# structured output, no capture yet — LT-511's list. Never invent a command.
vendor: Extreme
os: extreme_exos
name: ExtremeXOS
ntc_platform: extreme_exos
phase: 1
fingerprint:
  probe: show version
  match_regex: ExtremeXOS
session:
  prompt_pattern: '^(\*\s?)?[\w.\-]+(\.\d+)?\s?[>#]\s?$'
  privilege_levels:
    exec:
      pattern: '^(\*\s?)?[\w.\-]+(\.\d+)?\s?[>#]\s?$'
  default_privilege: exec
  paging:
    off:
      - disable clipaging
      - disable cli prompting
    source: netmiko extreme_exos.py session_preparation
  on_close:
    - exit
  failed_when_contains:
    - "%% Invalid input"
    - "%% Incomplete command"
    - "%% Ambiguous command"
  source: netmiko extreme_exos.py; the prompt's trailing `.N` counts commands and is ignored
role_hint:
  - match: ExtremeXOS
    role: l3_switch
role_defaults:
  l3_switch:
    - switching
    - routing
    - lldp
caps_probe: []
commands:
  - id: show_version
    cmd: show version
    gate: always
    parser: none
    feeds:
      - device
    weight: light
    timeout: 30
    verified: unverified
    evidence: no template, no structured output, no capture yet (LT-511)
  - id: show_ports_information
    cmd: show ports information
    gate: always
    parser: textfsm:extreme_exos_show_ports_information
    feeds:
      - interface
    weight: light
    timeout: 30
    verified: lab
    evidence: ntc-templates tests (1 captures)
