# Coreview discovery catalog — Fortinet FortiOS (fortios)
#
# First built 2026-09-29 by scripts/build-catalog.mjs from the operator's
# specification (docs/DISCOVERY-SPEC.md), ntc-templates' index
# (resources/templates/ntc, ntc-templates 9.3.0), and the scrapli drivers
# (scrapli 2026.02.20, scrapli_community 2025.01.30) plus netmiko 4.8.0 where
# named. Maintained by hand from here on; catalog.test.ts holds every
# command to the ntc index and the read-only allowlist (LT-512).
#
# verified: lab = a real capture parses (ntc-templates' tests, or a
# Coreview reader that met the operator's hardware); docs = documented,
# structured, or a template with no fixture; unverified = no template, no
# structured output, no capture yet — LT-511's list. Never invent a command.
vendor: Fortinet
os: fortios
name: FortiOS
ntc_platform: fortinet
phase: 1
fingerprint:
  probe: get system status
  # LT-565: a FortiSwitch has its own catalog.
  match_regex: "Version: Forti(Gate|Wifi)"
session:
  source: scrapli_community scrapli_community.fortinet.fortios.sync_driver.FortinetFortiOSDriver
  prompt_pattern: "[\\w_-]+ (\\([\\w-]+\\) )?[$#]"
  failed_when_contains:
    - "Unknown action"
    - "command parse error"
  on_close:
    - exit
  banner:
    prompt: "(Press 'a' to accept):"
    answer: a
    source: scrapli_community FortinetFortiOSDriver.prepare_session; netmiko fortinet_ssh.py session_preparation ("to accept")
  contexts:
    kind: vdom
    detect:
      cmd: get system status
      match: "^Virtual domain configuration: (multiple|enable|split-task)"
      source: netmiko fortinet_ssh.py _vdoms_enabled; scrapli_community _vdoms_status
    list:
      cmd: diagnose sys vd list
      match: ^name=(\S+)/
      source: spec (unverified); scrapli_community gather_vdoms uses `show | grep "config vdom" -f -A1` → ^edit (\w+)$
    enter_global:
      - config global
    enter:
      - config vdom
      - edit {vdom}
    leave:
      - end
    abort:
      - abort
      - end
    source: scrapli_community FortinetFortiOSDriver.context / _to_system; netmiko fortinet_ssh.py _config_global
  paging:
    check:
      cmd: get system console | grep ^output
      match: output\s*:\s*(\w+)
      want: standard
      in_global: true
      source: netmiko fortinet_ssh.py _get_output_mode_v7; scrapli_community prepare_session
    check_v6:
      cmd: show full-configuration system console
      match: ^\s+set output (\S+)\s*$
      source: netmiko fortinet_ssh.py _get_output_mode_v6
    off:
      - config system console
      - set output standard
      - end
    restore:
      - config system console
      - set output {original}
      - end
    in_global: true
    source: netmiko fortinet_ssh.py disable_paging / cleanup; scrapli_community prepare_session / cleanup_session; spec prep
  kex_note: "netmiko fortinet_ssh.py preferred_kex: group14-sha1, group-exchange-sha1, group-exchange-sha256, group1-sha1 — Coreview already offers these (LT-488)"
role_hint:
  - match: FortiGate|FortiWiFi|FGT|FWF
    role: firewall
  - match: FortiSwitch|FSW
    role: switch
role_defaults:
  firewall:
    - routing
    - nat
    - lldp
  switch:
    - switching
    - lldp
caps_probe:
  - id: get_system_status
    cmd: get system status
    flags:
      vdom: "^Virtual domain configuration: (multiple|enable|split-task)"
      ha: "^Current HA mode: (a-a|a-p)"
    timeout: 30
    parser: textfsm:fortinet_get_system_status
  - id: diagnose_sys_vd_list
    cmd: diagnose sys vd list
    flags: {}
    timeout: 30
    note: no flag rule written yet; output is kept and sets nothing
  - id: show_router_ospf
    cmd: show router ospf
    flags:
      ospf: set router-id|config area
      routing: set router-id
    timeout: 30
  - id: show_router_bgp
    cmd: show router bgp
    flags:
      bgp: set as \d
      routing: set as \d
    timeout: 30
  - id: show_router_static
    cmd: show router static
    flags:
      routing: ^\s+edit \d+
    timeout: 30
  - id: show_router_policy
    cmd: show router policy
    flags:
      pbr: ^\s+edit \d+
    timeout: 30
  - id: show_system_sdwan
    cmd: show system sdwan
    flags:
      sdwan: set status enable
    timeout: 30
  - id: show_system_virtual_wan_link
    cmd: show system virtual-wan-link
    flags: {}
    timeout: 30
    note: no flag rule written yet; output is kept and sets nothing
  - id: show_vpn_ipsec_phase1_interface
    cmd: show vpn ipsec phase1-interface
    flags:
      ipsec: ^\s+edit "
    timeout: 30
  - id: show_firewall_vip
    cmd: show firewall vip
    flags:
      nat: ^\s+edit "
    timeout: 30
  - id: show_system_interface
    cmd: show system interface
    flags:
      vrf: set vrf [1-9]
      switching: set type (aggregate|hard-switch|switch)
      gre: set type tunnel
      fortilink: set fortilink enable
    timeout: 30
commands:
