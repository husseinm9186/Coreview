# Coreview discovery catalog — FortiSwitchOS (fortiswitch)
#
# LT-565, 2026-09-29: split from `fortios`, whose fingerprint matched a
# FortiSwitch and sent it FortiGate commands. Built against the replies of
# the operator's FortiSwitch 224E (FortiSwitchOS 7.6.1) in the lab run
# (LT-558); the readers' fixtures keep that layout with invented values.
#
# verified: lab = a real capture parses (ntc-templates' tests, or a
# Coreview reader that met the operator's hardware); docs = documented,
# structured, or a template with no fixture; unverified = no template, no
# structured output, no capture yet — LT-511's list. Never invent a command.
vendor: Fortinet
os: fortiswitch
name: FortiSwitchOS
ntc_platform: fortinet
phase: 1
fingerprint:
  probe: get system status
  match_regex: 'Version: FortiSwitch'
session:
  source: scrapli_community scrapli_community.fortinet.fortios.sync_driver.FortinetFortiOSDriver; FortiSwitchOS shares FortiOS's shell (LT-565)
  prompt_pattern: '[\w_-]+ (\([\w-]+\) )?[$#]'
  on_close:
  - exit
  banner:
    prompt: '(Press ''a'' to accept):'
    answer: a
    source: scrapli_community FortinetFortiOSDriver.prepare_session; netmiko fortinet_ssh.py session_preparation ("to accept")
  paging:
    check:
      cmd: get system console | grep ^output
      match: output\s*:\s*(\w+)
      want: standard
      in_global: true
      source: netmiko fortinet_ssh.py _get_output_mode_v7; scrapli_community prepare_session
    check_v6:
      cmd: show full-configuration system console
      match: ^\s+set output (\S+)\s*$
      source: netmiko fortinet_ssh.py _get_output_mode_v6
    false:
    - config system console
    - set output standard
    - end
    restore:
    - config system console
    - set output {original}
    - end
    in_global: true
    source: netmiko fortinet_ssh.py disable_paging / cleanup; scrapli_community prepare_session / cleanup_session; spec prep
  kex_note: 'netmiko fortinet_ssh.py preferred_kex: group14-sha1, group-exchange-sha1, group-exchange-sha256, group1-sha1 — Coreview already offers these (LT-488)'
role_hint:
- match: FortiSwitch
  role: switch
role_defaults:
  switch:
  - switching
  - lldp
caps_probe: []
commands:
- id: get_system_status
  cmd: get system status
  gate: always
  parser: reader:fortios_system_status
  feeds:
  - device
  weight: light
  timeout: 30
  verified: lab
  evidence: Coreview fortios reader, met a FortiSwitch 224E on FortiSwitchOS 7.6.1 in the operator's lab (LT-558, LT-563)
- id: get_switch_lldp_neighbors_summary
  cmd: get switch lldp neighbors-summary
  gate: always
  parser: reader:fortiswitch_lldp_summary
  feeds:
  - neighbor
  weight: light
  timeout: 30
  verified: lab
  evidence: Coreview fortiswitch reader, met a FortiSwitch 224E on FortiSwitchOS 7.6.1 in the operator's lab (LT-558, LT-565)
- id: diagnose_switch_mac_address_list
  cmd: diagnose switch mac-address list
  gate: always
  parser: reader:fortiswitch_mac_list
  feeds:
  - mac_table
  weight: heavy
  timeout: 120
  verified: lab
  evidence: Coreview fortiswitch reader, met a FortiSwitch 224E on FortiSwitchOS 7.6.1 in the operator's lab (LT-558, LT-565)
- id: get_system_interface_physical
  cmd: get system interface physical
  gate: always
  parser: reader:fortiswitch_interfaces
  feeds:
  - interface
  - ip_address
  weight: light
  timeout: 30
  verified: lab
  evidence: Coreview fortiswitch reader, met a FortiSwitch 224E on FortiSwitchOS 7.6.1 in the operator's lab (LT-558, LT-565)
- id: get_router_info_routing_table_all
  cmd: get router info routing-table all
  gate: always
  parser: reader:fortios_routing_table
  feeds:
  - route
  weight: light
  timeout: 30
  verified: lab
  evidence: Coreview fortios reader, met a FortiSwitch 224E on FortiSwitchOS 7.6.1 in the operator's lab (LT-558, LT-564)
- id: get_system_arp
  cmd: get system arp
  gate: always
  parser: textfsm:fortinet_get_system_arp
  feeds:
  - arp
  weight: light
  timeout: 30
  verified: lab
  evidence: ntc-templates tests (1 captures); Coreview fortios reader
live_path: []
note: 'LT-565: FortiSwitchOS standalone. Its commands and readers met a FortiSwitch 224E in the operator''s lab; a FortiSwitch managed over FortiLink is read through its FortiGate.'
