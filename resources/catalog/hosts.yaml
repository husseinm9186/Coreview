# Coreview discovery catalog — hosts Linux, Proxmox, ESXi, Windows (phase 4) (hosts)
#
# First built 2026-09-29 by scripts/build-catalog.mjs from the operator's
# specification (docs/DISCOVERY-SPEC.md), ntc-templates' index
# (resources/templates/ntc, ntc-templates 9.3.0), and the scrapli drivers
# (scrapli 2026.02.20, scrapli_community 2025.01.30) plus netmiko 4.8.0 where
# named. Maintained by hand from here on; catalog.test.ts holds every
# command to the ntc index and the read-only allowlist (LT-512).
#
# verified: lab = a real capture parses (ntc-templates' tests, or a
# Coreview reader that met the operator's hardware); docs = documented,
# structured, or a template with no fixture; unverified = no template, no
# structured output, no capture yet — LT-511's list. Never invent a command.
vendor: hosts
os: hosts
name: Linux, Proxmox, ESXi, Windows (phase 4)
ntc_platform: linux
phase: 2
fingerprint: null
session:
  source: scrapli_community generic 'network' driver
  privilege_levels:
    exec:
      pattern: ^\S+@\S+:\S+:\S+\$\s*$
  default_privilege: exec
  failed_when_contains:
    - Permission denied
    - "ERROR:"
  on_close:
    - exit
role_hint: []
role_defaults: {}
caps_probe: []
commands:
  - id: ip_j_addr
    cmd: ip -j addr
    gate: role.linux-proxmox
    parser: json
    feeds:
      - ip_address
    weight: light
    timeout: 30
    verified: docs
    evidence: structured output (JSON); field mapping from documentation
  - id: ip_j_neigh
    cmd: ip -j neigh
    gate: role.linux-proxmox
    parser: json
    feeds:
      - arp
    weight: light
    timeout: 30
    verified: docs
    evidence: structured output (JSON); field mapping from documentation
  - id: lldpcli_show_neighbors_f_json
    cmd: lldpcli show neighbors -f json
    gate: role.linux-proxmox
    parser: json
    feeds:
      - neighbor
    weight: light
    timeout: 30
    verified: docs
    evidence: structured output (JSON); field mapping from documentation
  - id: esxcli_network_nic_list
    cmd: esxcli network nic list
    gate: role.esxi
    parser: none
    feeds:
      - interface
    weight: light
    timeout: 30
    verified: unverified
    evidence: no template, no structured output, no capture yet (LT-511)
  - id: esxcli_network_vswitch_standard_list
    cmd: esxcli network vswitch standard list
    gate: role.esxi
    parser: none
    feeds:
      - device
    weight: light
    timeout: 30
    verified: unverified
    evidence: no template, no structured output, no capture yet (LT-511)
  - id: vim_cmd_hostsvc_net_query_networkhint
    cmd: vim-cmd hostsvc/net/query_networkhint
    gate: role.esxi
    parser: none
    feeds:
      - neighbor
    weight: light
    timeout: 30
    verified: unverified
    evidence: no template, no structured output, no capture yet (LT-511)
  - id: get_netipconfiguration_convertto_json
    cmd: Get-NetIPConfiguration | ConvertTo-Json
    gate: role.windows
    parser: json
    feeds:
      - interface
      - ip_address
    weight: light
    timeout: 30
    verified: docs
    evidence: structured output (JSON); field mapping from documentation
  - id: get_netroute
    cmd: Get-NetRoute
    gate: role.windows
    parser: none
    feeds:
      - route
    weight: light
    timeout: 30
    verified: unverified
    evidence: no template, no structured output, no capture yet (LT-511)
  - id: get_netneighbor
    cmd: Get-NetNeighbor
    gate: role.windows
    parser: none
    feeds:
      - arp
    weight: light
    timeout: 30
    verified: unverified
    evidence: no template, no structured output, no capture yet (LT-511)
  - id: ip_j_route_show_table_all
    cmd: ip -j route show table all
    gate: role.linux-proxmox
    parser: json
    feeds:
      - route
    weight: heavy
    timeout: 120
    verified: docs
    evidence: structured output (JSON); field mapping from documentation
  - id: bridge_j_fdb_show
    cmd: bridge -j fdb show
    gate: role.linux-proxmox
    parser: json
    feeds:
      - mac_table
    weight: heavy
    timeout: 120
    verified: docs
    evidence: structured output (JSON); field mapping from documentation
live_path: []
note: "Phase-2 stub: the commands are catalogued, the session block is taken from scrapli; parsers come with Phase 2 (D-060)."
