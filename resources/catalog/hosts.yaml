# Coreview discovery catalog — Linux and Proxmox (hosts)
#
# First built 2026-09-29 by scripts/build-catalog.mjs from the operator's
# specification (docs/DISCOVERY-SPEC.md), ntc-templates' index
# (resources/templates/ntc, ntc-templates 9.3.0), and the scrapli drivers
# (scrapli 2026.02.20, scrapli_community 2025.01.30) plus netmiko 4.8.0 where
# named. Maintained by hand from here on; catalog.test.ts holds every
# command to the ntc index and the read-only allowlist (LT-512).
#
# verified: lab = a real capture parses (ntc-templates' tests, or a
# Coreview reader that met the operator's hardware); docs = documented,
# structured, or a template with no fixture; unverified = no template, no
# structured output, no capture yet — LT-511's list. Never invent a command.
#
# LT-550: split from the phase-4 hosts stub, which had no fingerprint and so
# was never recognised. iproute2 and lldpd answer in JSON, read by the table
# normaliser or by Coreview's readers; built from the tools' documentation
# (D-058) — `verified: docs` until the operator's capture.
vendor: hosts
os: hosts
name: Linux and Proxmox
ntc_platform: linux
phase: 2
fingerprint:
  probe: ip -j link
  match_regex: '"ifname"'
session:
  source: generic shell prompt (LT-550)
  privilege_levels:
    exec:
      pattern: ^\S+@\S+:.*[$#]\s?$
  default_privilege: exec
  failed_when_contains:
    - "command not found"
    - "Permission denied"
  on_close:
    - exit
role_hint:
  - match: '"ifname"'
    role: host
role_defaults: {}
caps_probe:
  - id: pveversion
    cmd: pveversion
    flags:
      proxmox: pve-manager
    timeout: 30
commands:
  - id: ip_j_addr
    cmd: ip -j addr
    gate: always
    parser: reader:linux_ip_addr
    feeds:
      - interface
      - ip_address
    weight: light
    timeout: 30
    verified: docs
    evidence: structured output (JSON), nested; Coreview reader from iproute2's documentation (D-058, LT-550)
  - id: ip_j_neigh
    cmd: ip -j neigh
    gate: always
    parser: json
    feeds:
      - arp
    weight: light
    timeout: 30
    verified: docs
    evidence: structured output (JSON); field mapping from documentation
  - id: ip_j_route_show_table_all
    cmd: ip -j route show table all
    gate: always
    parser: json
    feeds:
      - route
    weight: light
    timeout: 30
    verified: docs
    evidence: structured output (JSON); field mapping from documentation
  - id: bridge_j_fdb_show
    cmd: bridge -j fdb show
    gate: always
    parser: json
    feeds:
      - mac_table
    weight: light
    timeout: 60
    verified: docs
    evidence: structured output (JSON); field mapping from documentation
  - id: lldpcli_show_neighbors_f_json
    cmd: lldpcli show neighbors -f json
    gate: always
    parser: reader:linux_lldp
    feeds:
      - neighbor
    weight: light
    timeout: 30
    verified: docs
    evidence: structured output (JSON), keyed; Coreview reader from lldpd's documentation (D-058, LT-550)
live_path: []
note: "LT-550: Linux and Proxmox over SSH. A Proxmox host is flagged by `pveversion`; its bridges are read like any Linux bridge."
