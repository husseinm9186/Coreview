# Coreview discovery catalog — HPE Comware (hpe_comware)
#
# First built 2026-09-29 by scripts/build-catalog.mjs from the operator's
# specification (docs/DISCOVERY-SPEC.md), ntc-templates' index
# (resources/templates/ntc, ntc-templates 9.3.0), and the scrapli drivers
# (scrapli 2026.02.20, scrapli_community 2025.01.30) plus netmiko 4.8.0 where
# named. Maintained by hand from here on; catalog.test.ts holds every
# command to the ntc index and the read-only allowlist (LT-512).
#
# verified: lab = a real capture parses (ntc-templates' tests, or a
# Coreview reader that met the operator's hardware); docs = documented,
# structured, or a template with no fixture; unverified = no template, no
# structured output, no capture yet — LT-511's list. Never invent a command.
vendor: HPE
os: hpe_comware
name: Comware
ntc_platform: hp_comware
phase: 2
fingerprint:
  probe: display version
  match_regex: Comware
session:
  source: scrapli_community scrapli_community.hp.comware.sync_driver.HPComwareDriver
  privilege_levels:
    privilege_exec:
      pattern: ^<[a-z0-9.\-_@()/:]{1,48}>\s*$
  default_privilege: privilege_exec
  failed_when_contains:
    - "% Unrecognized command found at '^' position."
  on_open:
    - screen-length disable
  on_close:
    - quit
  ntc_platform: hp_comware
  paging:
    off:
      - screen-length disable
    source: scrapli_community hp_comware on_open; Coreview comware dialect
role_hint: []
role_defaults: {}
caps_probe: []
commands:
  - id: display_version
    cmd: display version
    gate: always
    parser: none
    feeds:
      - device
    weight: light
    timeout: 30
    verified: unverified
    evidence: no template, no structured output, no capture yet (LT-511)
    coreview_reader: true
  - id: display_interface_brief
    cmd: display interface brief
    gate: always
    parser: textfsm:hp_comware_display_interface_brief
    feeds:
      - interface
    weight: light
    timeout: 30
    verified: lab
    evidence: ntc-templates tests (4 captures)
  - id: display_ip_interface_brief
    cmd: display ip interface brief
    gate: always
    parser: textfsm:hp_comware_display_ip_interface
