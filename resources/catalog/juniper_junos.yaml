# Coreview discovery catalog — Juniper Junos (juniper_junos)
#
# First built 2026-09-29 by scripts/build-catalog.mjs from the operator's
# specification (docs/DISCOVERY-SPEC.md), ntc-templates' index
# (resources/templates/ntc, ntc-templates 9.3.0), and the scrapli drivers
# (scrapli 2026.02.20, scrapli_community 2025.01.30) plus netmiko 4.8.0 where
# named. Maintained by hand from here on; catalog.test.ts holds every
# command to the ntc index and the read-only allowlist (LT-512).
#
# verified: lab = a real capture parses (ntc-templates' tests, or a
# Coreview reader that met the operator's hardware); docs = documented,
# structured, or a template with no fixture; unverified = no template, no
# structured output, no capture yet — LT-511's list. Never invent a command.
vendor: Juniper
os: juniper_junos
name: Junos
ntc_platform: juniper_junos
phase: 1
fingerprint:
  probe: show version
  match_regex: JUNOS|Junos
session:
  source: scrapli scrapli.driver.core.juniper_junos.sync_driver.JunosDriver
  privilege_levels:
    exec:
      pattern: ^({\w+(:(\w+){0,1}\d){0,1}}\n){0,1}[\w\-@()/:\.]{1,63}>\s?$
  failed_when_contains:
    - is ambiguous
    - No valid completions
    - unknown command
    - syntax error
    - missing mandatory argument
    - invalid numeric value
  on_open:
    - set cli screen-length 0
    - set cli screen-width 511
    - set cli complete-on-space off
  on_close:
    - exit
  ntc_platform: juniper_junos
  paging:
    off:
      - set cli screen-length 0
      - set cli screen-width 511
      - set cli complete-on-space off
    source: scrapli JunosDriver on_open; netmiko juniper.py session_preparation
  structured:
    suffix: " | display xml"
    source: "spec: `| display xml` (json on ≥14.2)"
  strip_context_lines:
    pattern: ^\{(master|backup|line|primary|secondary)(:\d+)?\}\s*$|^\[edit\]\s*$
    source: netmiko juniper.py strip_context_items
  default_privilege: exec
role_hint:
  - match: \bEX\d|\bQFX
    role: switch
  - match: \bMX\d|\bACX|\bPTX
    role: router
  - match: \bSRX|vSRX
    role: firewall
role_defaults:
  switch:
    - switching
    - lldp
    - structured_output
  router:
    - routing
    - lldp
    - structured_output
  firewall:
    - routing
    - lldp
    - structured_output
    - ha
caps_probe:
  - id: show_configuration_protocols_display_set
    cmd: show configuration protocols | display set
    flags:
      ospf: ^set protocols ospf
      bgp: ^set protocols bgp
      isis: ^set protocols isis
      rip: ^set protocols rip
      mpls: ^set protocols (mpls|ldp|rsvp)
      lldp: ^set protocols lldp
      fhrp: vrrp-group
      vxlan_evpn: ^set protocols evpn
      routing: ^set protocols (ospf|bgp|isis|rip)
    timeout: 30
  - id: show_configuration_routing_instances_display_set
    cmd: show configuration routing-instances | display set
    flags:
      vrf: ^set routing-instances \S+ instance-type (vrf|virtual-router)
      vxlan_evpn: instance-type (evpn|mac-vrf)
    timeout: 30
  - id: show_configuration_firewall_display_set
    cmd: show configuration firewall | display set
    flags:
      pbr: routing-instance
    timeout: 30
  - id: show_configuration_security_display_set
    cmd: show configuration security | display set
    flags:
      nat: ^set security nat
      ipsec: ^set security ipsec
      fw_zone: ^set security zones
    timeout: 30
    gate: role.firewall
