# Coreview discovery catalog — NVIDIA Onyx / Mellanox MLNX-OS Ethernet (onyx)
#
# LT-651, 2026-09-30: the SN2010/SN2100/SN2700 Spectrum switches on NVIDIA's
# own CLI. **Built from NVIDIA's Onyx User Manual at the operator's
# instruction (D-058)** — the Rev 5.7 manual (3.6.8008 examples), the 3.8.2004
# manual and the 3.10.4504/3.10.4800 pages, many of whose examples NVIDIA has
# emptied; the readers say which layout they take. ntc-templates has no Onyx
# template, so every parser is a Coreview reader (coreview-collect
# readers/onyx.rs). Nothing here has met a device: every entry is
# `verified: docs` until the operator's support capture replaces the readers'
# fixtures (LT-649). Session rules from netmiko's mellanox_mlnxos_ssh.py and
# the manual's CLI chapter: `enable` reaches `#` with no password prompt,
# `terminal length` turns paging off without config mode, `exit` logs out.
#
# verified: lab = a real capture parses (ntc-templates' tests, or a
# Coreview reader that met the operator's hardware); docs = documented,
# structured, or a template with no fixture; unverified = no template, no
# structured output, no capture yet — LT-511's list. Never invent a command.
vendor: NVIDIA
os: onyx
name: Onyx / MLNX-OS
ntc_platform: null
phase: 1
fingerprint:
  probe: show version
  match_regex: '^Product name:\s+(Onyx|MLNX-OS)'
session:
  # `hostname [standalone: master] >`, `hostname [my-vip: standby] (config) #`
  prompt_pattern: '^\S+(?: \[[^\]]+: (?:master|standby)\])? ?(?:\(config[^)]*\) ?)?[>#] ?$'
  privilege_levels:
    exec:
      pattern: '^\S+(?: \[[^\]]+\])? ?> ?$'
    privilege_exec:
      pattern: '^\S+(?: \[[^\]]+\])? ?# ?$'
      escalate: enable
      escalate_auth: false
      previous: exec
      source: "netmiko mellanox_mlnxos_ssh.py enable(); Onyx UM: Standard mode lists only cli/enable/exit/help/no/show/slogin/switch/telnet/terminal/traceroute, show interfaces needs Enable mode; no password prompt documented"
  default_privilege: privilege_exec
  paging:
    off:
      - terminal length 999
      - terminal width 999
    source: "Onyx UM ui-commands: `terminal length <5-999>`, `terminal width <34-999>`, per session; netmiko's `no cli session paging enable` needs config mode, which is never entered"
  on_close:
    - exit
  failed_when_contains:
    - "% Unrecognized command"
    - "% Invalid"
    - "% Ambiguous command"
    - "% Incomplete command"
    - "% Unknown command"
  source: netmiko mellanox_mlnxos_ssh.py (no scrapli platform); Onyx UM command-line-interface-cli
role_hint:
  - match: Onyx|MLNX-OS
    role: l3_switch
role_defaults:
  l3_switch:
    - switching
    - lldp
caps_probe:
  - id: show_protocols
    cmd: show protocols
    flags:
      switching: '^Ethernet\s+enabled'
      lldp: '^\s+lldp\s+enabled'
      routing: '^IP routing\s+enabled'
      bgp: '^\s+bgp\s+enabled'
      ospf: '^\s+ospf\s+enabled'
      fhrp: '^\s+(vrrp|magp)\s+enabled'
      vpc_mlag_vsx: '^\s+mlag\s+enabled'
      vxlan_evpn: '^\s+(nve|vxlan|evpn)\s+enabled'
    timeout: 30
commands:
  - id: show_version
    cmd: show version
    gate: always
    parser: reader:onyx_version
    feeds:
      - device
    weight: light
    timeout: 30
    verified: docs
    evidence: Coreview onyx reader; Onyx UM Rev 5.7 and 3.10 `show version` examples (D-058, LT-651)
    coreview_reader: true
  - id: show_inventory
    cmd: show inventory
    gate: always
