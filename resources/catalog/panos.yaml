# Coreview discovery catalog — Palo Alto Networks PAN-OS (panos)
#
# First built 2026-09-29 by scripts/build-catalog.mjs from the operator's
# specification (docs/DISCOVERY-SPEC.md), ntc-templates' index
# (resources/templates/ntc, ntc-templates 9.3.0), and the scrapli drivers
# (scrapli 2026.02.20, scrapli_community 2025.01.30) plus netmiko 4.8.0 where
# named. Maintained by hand from here on; catalog.test.ts holds every
# command to the ntc index and the read-only allowlist (LT-512).
#
# verified: lab = a real capture parses (ntc-templates' tests, or a
# Coreview reader that met the operator's hardware); docs = documented,
# structured, or a template with no fixture; unverified = no template, no
# structured output, no capture yet — LT-511's list. Never invent a command.
vendor: Palo Alto Networks
os: panos
name: PAN-OS
ntc_platform: paloalto_panos
phase: 1
fingerprint:
  probe: show system info
  match_regex: "^model: PA-|^sw-version:"
session:
  source: scrapli_community generic 'network' driver
  privilege_levels:
    exec:
      pattern: ^[\w\._-]+@[\w\.\(\)_-]+>\s?$
  default_privilege: exec
  failed_when_contains:
    - "Unknown command:"
    - Invalid syntax.
    - Server error
    - "Validation Error:"
  on_open:
    - set cli scripting-mode on
    - set cli pager off
  on_close:
    - exit
  ntc_platform: paloalto_panos
  paging:
    off:
      - set cli scripting-mode on
      - set cli pager off
      - set cli config-output-format set
    source: scrapli_community paloalto_panos on_open; netmiko paloalto_panos.py session_preparation; spec prep (config-output-format set)
  contexts:
    kind: vsys
    detect:
      cmd: show system info
      match: "^multi-vsys: on"
      source: spec
    list:
      cmd: show system setting target-vsys
      match: vsys\d+
      source: unverified — no source encodes vsys listing; PAN-OS XML API `type=config&xpath=/config/devices/entry/vsys` is the API-side answer
    enter:
      - set system setting target-vsys {vsys}
    leave:
      - set system setting target-vsys none
    source: spec cap.vsys (unverified against a device)
  banner:
    prompt: Do you accept
    answer: yes
    source: netmiko paloalto_panos.py pa_banner_handler (keyboard-interactive)
  structured:
    api: XML API type=op, identical commands as <show><system><info></info></system></show>
    source: spec
role_hint:
  - match: PA-|VM-
    role: firewall
role_defaults:
  firewall:
    - routing
    - nat
    - lldp
    - structured_output
caps_probe:
  - id: show_system_info
    cmd: show system info
    flags:
      vsys: "^multi-vsys: on"
      advanced_routing: "^advanced-routing: on"
      ha: ^ha-mode|^ha-state
    timeout: 30
    parser: textfsm:paloalto_panos_show_system_info
  - id: show_config_running
    cmd: show config running
    flags:
      ospf: <ospf>\s*<enable>yes
      bgp: <bgp>\s*<enable>yes
      ipsec: <ipsec>
      pbr: <pbf>
      nat: <nat>\s*<rules>
      routing: <virtual-router>
      gre: <tunnel>
    timeout: 30
commands:
  - id: show_system_info
    cmd: show system info
    gate: always
    parser: xml
    shadow: textfsm:paloalto_panos_show_system_info
    feeds:
      - device
    weight: light
    timeout: 30
    verified: lab
    evidence: ntc-templates tests (1 captures)
    coreview_reader: true
