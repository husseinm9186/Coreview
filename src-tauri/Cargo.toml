[package]
name = "coreview"
version = "2.9.0"
description = "Coreview — local-first network diagram designer with live connectivity validation"
authors = ["Mohammed Almoola <https://www.linkedin.com/in/malmoola>"]
edition = "2021"
license = "LicenseRef-Almoola-Free-Proprietary"
# Proprietary: never published to crates.io.
publish = false
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = ["isolation"] }

[dependencies]
coreview-formats = { path = "../crates/coreview-formats" }
coreview-probe = { path = "../crates/coreview-probe" }
coreview-discover = { path = "../crates/coreview-discover" }
coreview-meraki = { path = "../crates/coreview-meraki" }
coreview-catalog = { path = "../crates/coreview-catalog" }
coreview-collect = { path = "../crates/coreview-collect" }
coreview-topology = { path = "../crates/coreview-topology" }
coreview-path = { path = "../crates/coreview-path" }
# Every message from the page passes a sandboxed frame first.
tauri = { version = "2", features = ["isolation"] }
tauri-plugin-dialog = "2"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
tokio = { version = "1", features = ["sync", "rt-multi-thread", "macros"] }
tokio-util = "0.7"
uuid = { version = "1", features = ["v4"] }
svg2pdf = "0.13.0"
# The same version svg2pdf resolves, named directly to put several diagrams
# into one document.
pdf-writer = "0.12"
# Already resolved through zip; named directly to open a compressed draw.io
# page.
flate2 = "1"
zip = { version = "4.2.0", default-features = false, features = ["deflate"] }
open = "5"
roxmltree = "0.20"
# The vault key in the OS keychain, when the operator asks for it —
# Credential Manager, the macOS Keychain, or the Secret Service over D-Bus.
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
zeroize = "1"
# The check for a newer release. Pinned below 2.13, which raises the
# plugin's MSRV to 1.90 while these manifests say 1.77. Without its
# `rustls-tls` feature on purpose: that feature turns on rustls's *ring*
# provider, and the rest of the workspace uses aws-lc-rs — with both enabled
# rustls cannot pick a process-level provider and every TLS client in the
# app panics at first use. The plugin's HTTP client gets its TLS from the
# same reqwest the collectors use, named here so that does not depend on
# feature unification happening to hold.
tauri-plugin-updater = { version = ">=2.12, <2.13", default-features = false, features = ["system-proxy", "zip"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[dev-dependencies]
tempfile = "3"
# For the test that the app's TLS stack has exactly one crypto provider.
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs", "std", "tls12"] }
# Arbitrary input for the IPC contract tests.
proptest = "1"
# Already resolved transitively through usvg (pdf.rs); pinned as a direct
# dependency so tests can check a converted SVG is well-formed XML, not just
# that it contains the right substrings. Was exactly this: a tag-count
# bug that a substring check would not have caught.
roxmltree = "0.20"
